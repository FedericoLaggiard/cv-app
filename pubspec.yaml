name: cv_app
description: "CV app - gestione curriculum multi-variante"
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.13.0

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Domain fundamentals (ticket 01-04).
  uuid: ^4.5.1
  meta: ^1.15.0

  # Stack MVP (ticket 06 + amendments 15/17).
  # Vedi docs/cv-app/issues/06-scelta-stack-flutter.md.
  # Nota: le versioni minime sono state alzate col bump SDK del ticket 19
  # (Flutter 3.47.2 / Dart 3.13); le major restano quelle scelte dal ticket 06.
  flutter_bloc: ^9.1.1              # state management (MIT)
  go_router: ^17.5.0                # routing (BSD-3-Clause)
  pdf: ^3.13.0                      # PDF generation (Apache-2.0)
  printing: ^5.15.0                 # PDF preview/share/print (Apache-2.0)
  file_picker: ^12.0.0              # import + saveFile() (MIT)
  share_plus: ^13.3.0               # share sheet + web download (BSD-3-Clause)
  idb_shim: ^2.9.0                  # IndexedDB wrapper (BSD-3-Clause)
  path_provider: ^2.1.5             # storage paths desktop/mobile (BSD-3-Clause)
  freezed_annotation: ^3.1.0        # v3.x pinned (report ticket 06)
  json_annotation: ^4.9.0
  flutter_markdown_plus: ^1.0.12    # preview Markdown (MIT)
  intl: ^0.20.2                     # date formatting per template PDF (BSD-3-Clause)
  shared_preferences: ^2.5.2        # ui_locale, onboarding_completed (BSD-3-Clause)

  # Markdown editor WYSIWYG. Il ticket 06 raccomandava la versione GitHub
  # perche' la release pub.dev era vecchia; usiamo invece le dev release
  # 0.3.0-dev.* (allineate con uuid v4 e Dart 3.11) pinnate a un range
  # stretto perche' l'API e' pre-1.0 e le breaking arrivano in punto.
  # Storage rimane Markdown puro, quindi swap all'Approccio A
  # (TextField + toolbar) resta reversibile senza toccare i dati.
  super_editor: ">=0.3.0-dev.31 <0.3.0-dev.40"
  super_editor_markdown: ^0.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # Code generation per freezed + json_serializable (ticket 06).
  # freezed sbloccato a v4.x col bump SDK del ticket 19 (v4 richiede Dart
  # >=3.13); non ancora usato nel codice, la migrazione e' il ticket 21.
  build_runner: ^2.4.13
  freezed: ^4.0.0
  json_serializable: ^6.14.1

  # BLoC unit-test helpers (companion a flutter_bloc).
  bloc_test: ^10.0.0

  # Rasterizzazione PNG per tool/generate_thumbnails.dart (ticket 25):
  # niente dipendenza runtime dell'app, solo lo script offline che genera
  # gli asset in assets/template_thumbnails/. Già presente transitivamente
  # nel lockfile (via altre dipendenze), qui pinnata esplicitamente perché
  # usata direttamente da codice del repo.
  image: ^4.9.0

  # E2E testing pilotato via Patrol (amendment ticket 17).
  # patrol_cli e' un tool a se stante, si installa con
  # `dart pub global activate patrol_cli`.
  patrol: ^4.9.0

  # CI locale al commit (ticket 18): complessita' ciclomatica offline
  # (MIT, fork mantenuto di DCM) + hook git installati via `make setup-hooks`.
  dart_code_linter: ^4.3.0
  husky: ^0.1.7

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # EB Garamond (SIL OFL, docs/cv-app/issues/08-design-template.md) embedded
  # via pw.Font.ttf() for the export PDF templates (ticket 24). Not
  # registered as a Flutter font family: loaded as raw bytes by
  # lib/src/pdf/pdf_fonts.dart, so it only needs to live under `assets:`.
  assets:
    - assets/fonts/EBGaramond-Regular.ttf
    - assets/fonts/EBGaramond-Italic.ttf
    - assets/fonts/EBGaramond-SemiBold.ttf
    - assets/fonts/EBGaramond-Bold.ttf
    - assets/fonts/EBGaramond-BoldItalic.ttf
    # Inter (SIL OFL) for the Moderno template (ticket 25) and for
    # Minimal's uppercase labels. Same loading pattern as EB Garamond,
    # via lib/src/pdf/pdf_fonts.dart's ModernoFonts. JetBrains Mono
    # (also planned in ticket 08) is intentionally NOT added here: the
    # shared MarkdownPdfRenderer has no code-fence support yet, so no
    # template actually renders monospace text — adding the asset now
    # would just be dead weight.
    - assets/fonts/Inter-Regular.ttf
    - assets/fonts/Inter-Italic.ttf
    - assets/fonts/Inter-SemiBold.ttf
    - assets/fonts/Inter-Bold.ttf
    - assets/fonts/Inter-BoldItalic.ttf
    # Thumbnail PNGs for the export template picker (ticket 25), generated
    # offline by tool/generate_thumbnails.dart.
    - assets/template_thumbnails/classico.png
    - assets/template_thumbnails/moderno.png
    - assets/template_thumbnails/minimal.png

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
